name: Finance Control
slug: finance_control
description: Privates Finance-Control-Cockpit als Home-Assistant-Add-on
version: "0.2.80"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
watchdog: "http://[HOST]:8785/health"
options:
  access_token: ""
  require_app_token: true
  cloudflare_team_domain: ""
  cloudflare_audience: ""
  administrator_email: ""
  fints_product_id: ""
  backup_retention_plan_sha256: ""
schema:
  access_token: password?
  require_app_token: bool
  cloudflare_team_domain: str?
  cloudflare_audience: str?
  administrator_email: str?
  fints_product_id: str?
  backup_retention_plan_sha256: "match(^$|^[a-f0-9]{64}$)"
stdin: true
backup: cold
backup_exclude:
  - FinanceControl/bank-secrets
  - FinanceControl/bank-secrets/*
  - FinanceControl/data/app_access_token
  # Generated package outputs only; manual CSV/JSON exports remain included.
  - FinanceControl/data/exports/[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].zip
  - FinanceControl/data/exports/[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].partial
  - FinanceControl/data/backups/*.sqlite
stage: experimental
